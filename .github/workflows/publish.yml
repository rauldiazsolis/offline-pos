name: Publicación

# #54. Con un tag vX.Y.Z publica el POS en su canal (/v<major del contrato>/) y limpia lo que quedó
# de las carpetas por versión (#148); en los demás casos solo regenera la home y /llms.txt (backends
# conocidos consultados en vivo). Cloudflare Pages sirve la rama `publish`.
on:
  push:
    tags: ['v*.*.*']
    branches: [main]
    paths: ['site/**'] # no se evalúa para tags
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Rama publish en publish-tree/
        run: |
          if git ls-remote --exit-code --heads origin publish > /dev/null; then
            git fetch --depth=1 origin publish:publish
            git worktree add publish-tree publish
          else
            git worktree add --orphan -b publish publish-tree
          fi

      # La guardia de "nunca bajar ni repetir la versión del canal" vive en build-channel.ts.
      - name: Canal y limpieza
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con package.json ($VERSION)"
            exit 1
          fi
          pnpm build
          node site/build-channel.ts --dist dist --site publish-tree
          node site/cleanup.ts --site publish-tree

      - name: Home y /llms.txt
        run: node site/build-home-page.ts --site publish-tree

      - name: Commit y push a publish
        run: |
          cd publish-tree
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Sin cambios: nada que publicar'
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then MSG="publish: $GITHUB_REF_NAME"; else MSG='publish: home'; fi
          git commit -m "$MSG"
          git push origin publish
