name: CI

# Corre en cada PR y con el tag (lo llama Publicación, que publica solo si pasa entero); no en el push
# a `main`: el PR ya probó el merge y el tag vuelve a correrlo antes de publicar (#207).
on:
  pull_request:
    branches: [main]
  workflow_call:

# Un push nuevo a un PR cancela la corrida vieja (abrir el PR y subir enseguida otro commit dispara
# dos, #207). Llamado desde Publicación, `github.workflow` y el evento son los del tag: nunca se
# cancela ni comparte grupo con un PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm --filter demo-backend run typecheck

      - run: pnpm test

      - run: pnpm --filter demo-backend run test

      - run: pnpm build

      # POS mobile (mobile/AGENTS.md).
      - run: pnpm --filter pos-mobile run typecheck

      - run: pnpm --filter pos-mobile run test

      - run: pnpm --filter pos-mobile run build

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      # Si falla el e2e, o si un test pasó recién al reintentar (queda su trace.zip), sube la
      # traza, las capturas y el error-context.md de cada test (#169).
      - uses: actions/upload-artifact@v7
        if: failure() || hashFiles('test-results/**/trace.zip') != ''
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
