name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Publicación lo llama con un tag y publica solo si pasa entero.
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm --filter demo-backend run typecheck

      - run: pnpm test

      - run: pnpm --filter demo-backend run test

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      # Si falla el e2e, o si un test pasó recién al reintentar (queda su trace.zip), sube la
      # traza, las capturas y el error-context.md de cada test (#169).
      - uses: actions/upload-artifact@v7
        if: failure() || hashFiles('test-results/**/trace.zip') != ''
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
