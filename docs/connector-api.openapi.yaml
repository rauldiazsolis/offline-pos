openapi: 3.1.0
info:
  title: offline-pos Connector API
  version: '3.0.0'
  description: |
    Contrato que cualquier sistema externo (ERP, e-commerce, facturación,
    inventario) debe implementar para conectarse al POS — ver §6 del doc de
    diseño (`pos-web-diseno-arquitectura.md`), la sección "Connector API" de
    `CLAUDE.md` y los specs de rediseño
    (`docs/superpowers/specs/2026-09-22-sync-por-lotes-design.md`, issue #87;
    `docs/superpowers/specs/2026-09-23-contrato-connector-api-v3-design.md`,
    issue #96).

    **v3 reemplaza a la v2** (cambio incompatible, Etapa 1 del epic #94):
      - Sobre por evento: cada `OutboxBatchItem` lleva `id`, `type`,
        `createdAt` y `origin` (`branch`/`pointOfSale`, estampados en el POS
        al encolar el evento, no al armar el lote). El `deviceId` de la
        terminal viaja una vez por request, en push y en pull.
      - Estados de lote `queued` (recibido, sin empezar), `processing`, `ok`
        e `issues`; `pending` desaparece. `issues` pasa de texto a
        `LotIssue` (`{ message, eventId? }`).
      - Eventos nuevos `cash-movement` y `customer-payment`; se elimina
        `cash-session`. Cobranzas y movimientos de caja no se anulan.
      - Cantidades con signo y hasta 3 decimales; `Sale.total` y
        `Payment.amount` pueden ser negativos (devolución declarativa).
      - El pull trae `createdAt` (obligatorio) y `blocked` (bloqueo
        informativo) en productos y clientes.

    **Identidad**: `deviceId`, `origin.branch` y `origin.pointOfSale` son
    obligatorios en v3. El POS los manda siempre desde la Etapa 2 del epic #94
    (#97). Un evento encolado antes puede llegar sin ellos: el backend lo
    guarda con el valor vacío.

    **v2 reemplazó por completo la v1** (10 endpoints por recurso/evento) por
    dos operaciones batch más dos excepciones síncronas. Principio central:
    **el backend nunca valida ni rechaza el contenido de lo que el POS
    manda** — solo registra y audita. Puede dejar de aceptar lotes de una
    terminal por motivos propios (cuota, contrato), pero eso nunca lo hace
    devolviendo un error de negocio a un push: se resuelve puertas adentro
    o se informa como `issues` en un pull posterior, nunca como un
    "rechazo" síncrono.

    Cada operación está marcada con una extensión `x-pos-status`:
      - `implemented-v3`: el POS ya la consume con la forma de v3 (#96).
      - `documented-not-implemented`: parte del contrato, sin consumidor todavía.

    Autenticación: Bearer token, configurado por terminal (ver `/CONFIG` en
    la app) — desacoplada del contrato en sí, cada integración define cómo
    emite ese token.
servers:
  - url: https://api.example.com
    description: Placeholder — cada instalación configura su propia base URL vía /CONFIG.
security:
  - bearerAuth: []

paths:
  /sync/push:
    post:
      operationId: pushBatch
      summary: Envía toda la cola pendiente del outbox en un solo lote
      x-pos-status: implemented-v3
      description: |
        Un solo `idempotency_id` para el lote entero (no uno por evento) —
        reintentar el mismo lote (mismo id, mismo conjunto de eventos) nunca
        debe duplicar su efecto. La respuesta es un ack de **recepción**, no
        de procesamiento: el backend puede seguir procesando el lote después
        de responder 200. El estado real de procesamiento (`ok`/`issues`) se
        consulta después, vía `/sync/pull` (ver `PullBatchResponse.lots`).

        El backend nunca devuelve un error de negocio acá — solo errores de
        transporte reales (auth, payload no parseable). Cualquier
        inconsistencia de negocio (stock, cuenta corriente) se resuelve del
        lado del backend y se informa como `issues`, nunca como un 4xx.

        v3: el backend puede dejar un lote `queued` (recibido, sin empezar) o
        `processing` y resolverlo después. Un tipo de evento que no reconoce
        (por ejemplo un `cash-session` de una terminal vieja) se informa como
        `LotIssue` con su `eventId` — nunca como error del push, y nunca
        impide aplicar el resto del lote.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushBatchRequest'
      responses:
        '200':
          description: Lote recibido (o ya recibido antes, si el idempotency_id se repite).

  /sync/pull:
    post:
      operationId: pullBatch
      summary: Trae productos, stock y clientes en una sola llamada, más el estado de lotes de push
      x-pos-status: implemented-v3
      description: |
        Un `POST` (no `GET`) porque los parámetros son estructurados
        (cursores por recurso, lista de ids de lotes) — no una query string
        plana.

        Cada recurso trae su propio cursor `since` opcional en el request:
        **ausente pide la foto completa de ese recurso**, que tiene que ser
        el conjunto entero, no paginado ni truncado (el POS la usa para
        darse cuenta de las bajas — un delta nunca las informa). `stock`
        nunca tiene cursor: siempre viaja completo, es liviano.

        `lots` en la respuesta trae estado para los ids de `pendingLotIds`
        que el backend recibió; un id que no recibió se omite. Del lado del
        POS, un lote con ack que no viene informado cuenta como `processing`;
        el lote que el POS mandó sin recibir ack (también viaja en
        `pendingLotIds`) y no viene informado, como **no recibido**. Si viene
        informado, el POS lo toma como un ack recuperado y no lo reenvía.

        **Consistencia**: la foto (productos, clientes con su saldo, stock) y
        los estados de lote tienen que ser **del mismo instante**. Un lote
        `queued` todavía no tiene ningún efecto en la foto; uno `ok`/`issues`
        ya los tiene todos. Todo cambio de saldo de un cliente mueve su
        cursor (`updatedAt`), así viaja en el pull por delta.

        **Regla de aplicación del POS (Etapa 3 del epic #94, #98)**: datos
        maestros y bloqueos de productos y clientes se aplican siempre. Stock
        y saldos: si algún lote sigue `processing` (o equivalente), el POS
        conserva los suyos y no avanza el cursor de clientes; si no, toma los
        del backend y les reaplica los efectos de los eventos de lotes
        `queued` y de los que todavía no envió. El backend puede bloquear
        productos y clientes por lo que surja al procesar un lote, aun
        mientras está `processing`. Un lote `issues` nunca bloquea: el POS
        solo le muestra los avisos al humano.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullBatchRequest'
      responses:
        '200':
          description: Datos pedidos, más el estado de los lotes de interés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullBatchResponse'

  /account-holds:
    post:
      operationId: postAccountHold
      summary: Bloqueo síncrono de crédito antes de cerrar una venta a cuenta corriente
      x-pos-status: implemented-v3
      description: |
        Única operación del contrato pensada para llamarse de forma síncrona
        durante el cobro (§5 del doc de diseño) — nunca pasa por el outbox ni
        por `/sync/push`. Sin cambios respecto de la v1 del contrato.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountHoldRequest'
      responses:
        '200':
          description: Resultado del bloqueo (aprobado o rechazado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountHoldResponse'

  /account-balance/{customerId}:
    get:
      operationId: getAccountBalance
      summary: Consulta síncrona del saldo cacheado de un cliente (futura cobranza de cuenta corriente)
      x-pos-status: documented-not-implemented
      description: |
        Todavía no implementada del lado del POS (backlog #51/#59) — se deja
        documentada para que agregar cobranza de cuenta corriente más
        adelante sea sumar un consumidor a un endpoint ya definido, no
        rediseñar el contrato. Síncrona por el mismo motivo que
        `/account-holds`: la pantalla de cobranza necesita el saldo ya para
        decidir cuánto ofrecer cobrar.
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Saldo actual cacheado del backend para ese cliente.
          content:
            application/json:
              schema:
                type: object
                required: [balance]
                properties:
                  balance: { type: number }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token configurado por terminal (ver `/CONFIG`) — opcional si el backend no lo requiere.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: ULID del lote (o de la operación síncrona) — repetir el mismo valor nunca debe duplicar el efecto.

  schemas:
    Blocked:
      type: object
      required: [reason]
      description: |
        Bloqueo informativo — nunca impide operar; el POS lo muestra y el
        usuario decide. Ausente = no bloqueado. `reason` puede ser vacío (el
        POS muestra "Bloqueado" a secas).
      properties:
        reason: { type: string }

    Product:
      type: object
      required: [id, sku, barcodes, name, price, taxRate, category, tracksStock, createdAt]
      properties:
        id: { type: string }
        sku: { type: string }
        barcodes: { type: array, items: { type: string } }
        name: { type: string }
        price: { type: number, minimum: 0 }
        taxRate: { type: number, minimum: 0, maximum: 1 }
        category: { type: string }
        tracksStock: { type: boolean }
        createdAt: { type: string, format: date-time, description: Fecha de alta real. }
        blocked: { $ref: '#/components/schemas/Blocked' }

    StockItem:
      type: object
      required: [productId, quantity, updatedAt]
      properties:
        productId: { type: string }
        quantity: { type: number, description: 'Con signo, hasta 3 decimales.' }
        updatedAt: { type: string, format: date-time }

    Customer:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        document: { type: string }
        phone: { type: string }
        createdAt:
          type: string
          format: date-time
          description: |
            Fecha de alta real — obligatoria en el pull. En un evento
            `customer` es la fecha en que se creó en el POS.
        blocked: { $ref: '#/components/schemas/Blocked' }
        creditLimit:
          { type: number, description: Cuenta corriente, opcional — ver §6 del doc de diseño. }
        margin: { type: number }
        balance: { type: number }
        updatedAt: { type: string, format: date-time }
        unrestricted:
          type: boolean
          description: |
            Fiado sin bloqueo de crédito para este cliente (Etapa 3, #69) —
            aprueba sin evaluar creditLimit/margin/balance, que pueden omitirse.

    Discount:
      type: object
      required: [type, value]
      properties:
        type: { type: string, enum: [amount, percentage] }
        value: { type: number }

    SaleLine:
      oneOf:
        - $ref: '#/components/schemas/ProductSaleLine'
        - $ref: '#/components/schemas/FreeformSaleLine'

    ProductSaleLine:
      type: object
      required: [kind, productId, qty, unitPrice]
      properties:
        kind: { type: string, enum: [product] }
        productId: { type: string }
        qty: { type: number, description: 'Con signo, hasta 3 decimales (se vende por peso).' }
        unitPrice: { type: number }
        discount: { $ref: '#/components/schemas/Discount' }

    FreeformSaleLine:
      type: object
      required: [kind, description, qty, unitPrice]
      properties:
        kind: { type: string, enum: [freeform] }
        description: { type: string }
        qty: { type: number, description: 'Con signo, hasta 3 decimales.' }
        unitPrice: { type: number }
        discount: { $ref: '#/components/schemas/Discount' }

    Payment:
      type: object
      required: [method, amount]
      properties:
        method: { type: string, enum: [cash, debit, credit, transfer, qr, account] }
        amount:
          type: number
          description: |
            Con signo, 2 decimales. Un ticket negativo es una devolución
            declarativa, con cualquier medio. Un pago `account` sin
            `reference` (sin hold) es fiado offline si es positivo, o una
            acreditación al cliente si es negativo — un pago `account`
            negativo nunca lleva hold.
        reference:
          type: string
          description: Para method=account con red, el holdId del bloqueo aprobado (§5).

    Sale:
      type: object
      required: [id, lines, payments, total, status, createdAt]
      properties:
        id: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/SaleLine' } }
        payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
        total: { type: number, description: 'Puede ser 0 o negativo (devolución).' }
        status: { type: string, enum: [open, closed, voided] }
        createdAt: { type: string, format: date-time }
        syncedAt: { type: string, format: date-time }
        voidedAt: { type: string, format: date-time }
        voidReason: { type: string }
        customerId: { type: string }

    StockMovement:
      type: object
      required: [id, productId, delta, reason, createdAt]
      properties:
        id: { type: string }
        productId: { type: string }
        delta: { type: number, description: 'Con signo, hasta 3 decimales.' }
        reason: { type: string, enum: [sale, sale-void] }
        saleId: { type: string }
        createdAt: { type: string, format: date-time }

    CashMovement:
      type: object
      required: [id, direction, amount, concept, source, createdAt]
      description: |
        Ingreso/egreso de caja. El arqueo viaja solo como ajuste
        (`source: count-adjustment`, concepto fijo "Ajuste por arqueo",
        `direction` según el signo de `counted - expected` y
        `amount = |counted - expected|`) y solo si la diferencia no es 0.
        No se anula: un movimiento mal cargado se compensa con otro.
      properties:
        id: { type: string }
        direction: { type: string, enum: [in, out] }
        amount: { type: number, exclusiveMinimum: 0, description: 2 decimales. }
        concept: { type: string }
        description: { type: string }
        source: { type: string, enum: [manual, count-adjustment] }
        count:
          type: object
          required: [expected, counted]
          description: Obligatorio si source = count-adjustment.
          properties:
            expected: { type: number }
            counted: { type: number }
        createdAt: { type: string, format: date-time }

    CustomerPayment:
      type: object
      required: [id, customerId, payments, total, createdAt]
      description: |
        Cobranza sin venta, a favor de un cliente identificado (tenga o no
        cuenta corriente). Sin vuelto: lo tendido es lo acreditado. No se
        anula: se corrige con otro registro.
      properties:
        id: { type: string }
        customerId: { type: string }
        payments:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
          description: method != account, amount > 0.
        total: { type: number, description: Suma de payments. }
        createdAt: { type: string, format: date-time }

    EventOrigin:
      type: object
      required: [branch, pointOfSale]
      description: |
        Sucursal y punto de venta, texto libre, estampados al encolar el
        evento en el POS (no al armar el lote): cambiar la sucursal con
        eventos pendientes no reescribe los ya encolados. Obligatorios en
        v3: el POS los manda siempre desde la Etapa 2 del epic #94 (#97). Un
        evento encolado antes puede llegar sin ellos: el backend lo guarda
        con el valor vacío.
      properties:
        branch: { type: string }
        pointOfSale: { type: string }

    EventEnvelope:
      type: object
      required: [id, type, createdAt, origin]
      description: Sobre común de los 8 tipos de evento.
      properties:
        id:
          type: string
          description: Id del evento — también el que usan los LotIssue (`eventId`).
        type: { type: string }
        createdAt:
          { type: string, format: date-time, description: Cuándo se encoló el evento en el POS. }
        origin: { $ref: '#/components/schemas/EventOrigin' }

    OutboxBatchItem:
      description: |
        Un evento del outbox tal como viaja dentro de un lote de push —
        sobre (`EventEnvelope`) más el payload de su tipo, discriminado por
        `type`. Un tipo que el backend no reconoce se informa como
        `LotIssue` del lote, nunca como error.
      oneOf:
        - $ref: '#/components/schemas/SaleEvent'
        - $ref: '#/components/schemas/StockMovementEvent'
        - $ref: '#/components/schemas/SaleVoidEvent'
        - $ref: '#/components/schemas/CustomerEvent'
        - $ref: '#/components/schemas/AccountHoldConfirmEvent'
        - $ref: '#/components/schemas/AccountHoldReleaseEvent'
        - $ref: '#/components/schemas/CashMovementEvent'
        - $ref: '#/components/schemas/CustomerPaymentEvent'

    SaleEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [type, sale]
          properties:
            type: { type: string, enum: [sale] }
            sale: { $ref: '#/components/schemas/Sale' }

    StockMovementEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [type, movement]
          properties:
            type: { type: string, enum: [stock-movement] }
            movement: { $ref: '#/components/schemas/StockMovement' }

    SaleVoidEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [type, saleId, voidedAt]
          description: Solo para ventas — cobranzas y movimientos de caja no se anulan.
          properties:
            type: { type: string, enum: [sale-void] }
            saleId: { type: string }
            voidedAt: { type: string, format: date-time }
            voidReason: { type: string }

    CustomerEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [type, customer]
          properties:
            type: { type: string, enum: [customer] }
            customer: { $ref: '#/components/schemas/Customer' }

    AccountHoldConfirmEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [type, holdId, saleId]
          properties:
            type: { type: string, enum: [account-hold-confirm] }
            holdId: { type: string }
            saleId: { type: string }

    AccountHoldReleaseEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [type, holdId]
          properties:
            type: { type: string, enum: [account-hold-release] }
            holdId: { type: string }

    CashMovementEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [type, movement]
          properties:
            type: { type: string, enum: [cash-movement] }
            movement: { $ref: '#/components/schemas/CashMovement' }

    CustomerPaymentEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [type, payment]
          properties:
            type: { type: string, enum: [customer-payment] }
            payment: { $ref: '#/components/schemas/CustomerPayment' }

    PushBatchRequest:
      type: object
      required: [deviceId, events]
      properties:
        deviceId:
          type: string
          description: UUID de la terminal, una vez por request. El POS lo manda siempre desde la Etapa 2 del epic #94 (#97).
        events:
          type: array
          items: { $ref: '#/components/schemas/OutboxBatchItem' }

    PullBatchRequest:
      type: object
      required: [deviceId, cursors, pendingLotIds]
      properties:
        deviceId:
          type: string
          description: |
            UUID de la terminal (el POS lo manda siempre desde la Etapa 2 del
            epic #94, #97). En v3 todavía no
            se usa: habilita que el backend informe lotes que la terminal
            perdió de vista (#90).
        cursors:
          type: object
          description: Cursor por recurso; ausente pide la foto completa de ese recurso.
          properties:
            products: { type: string }
            customers: { type: string }
        pendingLotIds:
          type: array
          items: { type: string }
          description: |
            idempotency_id de lotes de push que el POS mandó y todavía no
            confirmó ok/issues, más el lote en curso cuyo ack no llegó (si hay
            uno). El backend informa solo los que recibió.

    ProductsPullResult:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        nextCursor: { type: string, description: Pasar como cursors.products en el próximo pull. }

    CustomersPullResult:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Customer' } }
        nextCursor: { type: string, description: Pasar como cursors.customers en el próximo pull. }

    LotIssue:
      type: object
      required: [message]
      description: Aviso del backend sobre un lote ya procesado. Siempre se refiere a un lote.
      properties:
        message: { type: string, description: Texto para el humano. }
        eventId: { type: string, description: Id del evento del lote al que se refiere el aviso. }

    BatchLotStatus:
      description: |
        `queued` = recibido, sin empezar; `processing` = en curso; `ok` =
        procesado sin avisos; `issues` = procesado, con avisos para el
        humano (nunca bloquea al POS). Un lote pedido y no informado se
        trata como `processing`.
      oneOf:
        - type: object
          required: [status]
          properties: { status: { type: string, enum: [queued] } }
        - type: object
          required: [status]
          properties: { status: { type: string, enum: [processing] } }
        - type: object
          required: [status]
          properties: { status: { type: string, enum: [ok] } }
        - type: object
          required: [status, issues]
          properties:
            status: { type: string, enum: [issues] }
            issues: { type: array, items: { $ref: '#/components/schemas/LotIssue' } }

    PullBatchResponse:
      type: object
      required: [products, customers, stock, lots]
      properties:
        products: { $ref: '#/components/schemas/ProductsPullResult' }
        customers: { $ref: '#/components/schemas/CustomersPullResult' }
        stock: { type: array, items: { $ref: '#/components/schemas/StockItem' } }
        lots:
          type: object
          additionalProperties: { $ref: '#/components/schemas/BatchLotStatus' }
          description: Una entrada por cada id de pendingLotIds que el backend todavía reconoce.

    AccountHoldRequest:
      type: object
      required: [customerId, amount]
      properties:
        customerId: { type: string }
        amount: { type: number }

    AccountHoldResponse:
      oneOf:
        - type: object
          required: [approved, holdId]
          properties:
            approved: { type: boolean, enum: [true] }
            holdId: { type: string }
        - type: object
          required: [approved, reasonCode]
          properties:
            approved: { type: boolean, enum: [false] }
            reasonCode: { type: string }
