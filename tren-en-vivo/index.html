<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10161c">
<title>Tren en vivo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Una pantalla: mapa arriba, tablero de velocidad abajo, como el cuadro de una cabina */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --fg:#16202a; --muted:#5c6b78; --line:#d8dee3;
  --accent:#0a7d5a; --warn:#b85c00; --bad:#b3261e; --track:#0a7d5a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1318; --panel:#151d24; --fg:#e8eef2; --muted:#8c9aa6; --line:#26323c;
  --accent:#3ddc97; --warn:#ffb454; --bad:#ff6b5e; --track:#3ddc97; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.trains{display:flex;gap:6px;flex:1 1 100%;min-width:0}
.btn{flex:1}
.train{flex:1;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;
  padding:8px 10px;font:600 15px var(--body);text-align:left;cursor:pointer;min-width:0}
.train small{display:block;font:500 12px var(--mono);color:var(--muted)}
.train[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn{border:1.5px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:9px 12px;
  font:600 14px var(--body);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04140d}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#map{flex:1;min-height:200px;background:var(--line)}
.leaflet-container{font-family:var(--body)}
.dash{background:var(--panel);border-top:1px solid var(--line);
  padding-block:10px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.speed{font:700 84px/0.9 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.speed span{font:500 20px var(--display);color:var(--muted);letter-spacing:.5px;margin-left:4px}
.where{min-width:0}
.where .place{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.where .coords{font:500 12px var(--mono);color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--body);text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.status.ok .dot{background:var(--accent)} .status.weak .dot{background:var(--warn)} .status.err .dot{background:var(--bad)}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.stat{border-left:2px solid var(--line);padding-left:8px;min-width:0}
.stat b{display:block;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.stat i{font-style:normal;font:600 10.5px var(--body);text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
canvas{grid-column:1/-1;width:100%;height:56px;display:block}
.msg{grid-column:1/-1;color:var(--bad);font-weight:600;font-size:14px}
.msg:empty{display:none}
@media (max-width:420px){.speed{font-size:68px}.stats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="trains" role="group" aria-label="Tren">
    <button class="train" id="t-ic720" data-id="IC720" data-vmax="200">Intercidades 720<small>IC 720</small></button>
    <button class="train" id="t-r485" data-id="R485" data-vmax="120">Regional 485<small>R 485</small></button>
  </div>
  <button class="btn primary" id="start">Empezar</button>
  <button class="btn" id="follow" aria-pressed="true">Seguir</button>
  <button class="btn" id="reset">Borrar viaje</button>
</header>
<div id="map"></div>
<section class="dash" aria-live="polite">
  <div class="speed" id="speed">--<span>km/h</span></div>
  <div class="where">
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Sin GPS</span></div>
    <div class="place" id="place">Tocá «Empezar» y permití la ubicación</div>
    <div class="coords" id="coords">—</div>
  </div>
  <div class="stats">
    <div class="stat"><b id="vmax">--</b><i>Máx. km/h</i></div>
    <div class="stat"><b id="vavg">--</b><i>Media km/h</i></div>
    <div class="stat"><b id="dist">0,0</b><i>Recorrido km</i></div>
    <div class="stat"><b id="time">0:00</b><i>Tiempo</i></div>
  </div>
  <canvas id="chart" aria-label="Velocidad de los últimos 10 minutos"></canvas>
  <div class="msg" id="msg"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const nf0 = new Intl.NumberFormat('es',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('es',{minimumFractionDigits:1,maximumFractionDigits:1});
const store = {
  get(k,d){try{const v=localStorage.getItem('tren:'+k);return v?JSON.parse(v):d}catch{return d}},
  set(k,v){try{localStorage.setItem('tren:'+k,JSON.stringify(v))}catch{}}
};

// --- Mapa: calles de OpenStreetMap + capa de vías de OpenRailwayMap
const map = L.map('map',{zoomControl:true}).setView([39.5,-8.0],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const rail = L.tileLayer('https://{s}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png',{maxZoom:19,opacity:.75,attribution:'© OpenRailwayMap'}).addTo(map);
L.control.layers(null,{'Vías (OpenRailwayMap)':rail}).addTo(map);
const trackLine = L.polyline([], {color:getComputedStyle(document.documentElement).getPropertyValue('--track').trim()||'#0a7d5a',weight:5,opacity:.85}).addTo(map);
const marker = L.circleMarker([0,0],{radius:9,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1});
const accCircle = L.circle([0,0],{radius:0,color:'#1a73e8',weight:1,fillOpacity:.08});

// --- Estado del viaje (por tren)
let train = store.get('train','IC720');
let trip, watchId = null, follow = true, lastGeocode = null, wakeLock = null;

function emptyTrip(){return {pts:[],dist:0,vmax:0,movingMs:0,start:null}}
function loadTrip(){
  trip = store.get('trip:'+train, emptyTrip());
  trackLine.setLatLngs(trip.pts.map(p=>[p.la,p.lo]));
  if(trip.pts.length){const p=trip.pts[trip.pts.length-1];placeMarker(p.la,p.lo,p.acc||0);map.fitBounds(trackLine.getBounds(),{maxZoom:14,padding:[20,20]})}
  render(null);
}
function saveTrip(){
  if(trip.pts.length>5000) trip.pts = trip.pts.filter((_,i)=>i%2===0||i>trip.pts.length-500);
  store.set('trip:'+train, trip);
}
function selectTrain(id){
  train = id; store.set('train',id);
  document.querySelectorAll('.train').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.id===id)));
  document.title = (id==='IC720'?'IC 720':'R 485')+' · Tren en vivo';
  loadTrip();
}
document.querySelectorAll('.train').forEach(b=>b.addEventListener('click',()=>selectTrain(b.dataset.id)));

// --- Distancia (haversine, metros)
function hav(a,b){const R=6371000,r=Math.PI/180;const dLa=(b.la-a.la)*r,dLo=(b.lo-a.lo)*r;
  const s=Math.sin(dLa/2)**2+Math.cos(a.la*r)*Math.cos(b.la*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(s))}

function placeMarker(la,lo,acc){
  marker.setLatLng([la,lo]); accCircle.setLatLng([la,lo]).setRadius(acc);
  if(!map.hasLayer(marker)){marker.addTo(map);accCircle.addTo(map)}
}

let smooth = null;
function onPos(pos){
  const c = pos.coords, t = pos.timestamp || Date.now();
  const p = {la:c.latitude, lo:c.longitude, t, acc:Math.round(c.accuracy||0)};
  const prev = trip.pts[trip.pts.length-1];
  let v = (c.speed!=null && !isNaN(c.speed) && c.speed>=0) ? c.speed*3.6 : null;  // km/h del GPS
  if(prev){
    const d = hav(prev,p), dt = (t-prev.t)/1000;
    if(v==null && dt>0.5) v = d/dt*3.6;            // si el GPS no da velocidad, se calcula
    const plausible = d < Math.max(50, dt*100) && p.acc < 200;  // descarta saltos (>360 km/h) y fixes muy malos
    if(plausible && (d > Math.max(3, p.acc*0.3))){
      trip.dist += d;
      if((v||0) > 3) trip.movingMs += t-prev.t;
      p.v = v; trip.pts.push(p); trackLine.addLatLng([p.la,p.lo]);
    } else if(!plausible){ v = smooth; }
  } else { p.v = v||0; trip.pts.push(p); trackLine.addLatLng([p.la,p.lo]); trip.start = trip.start||t; }
  if(v!=null){ smooth = smooth==null ? v : smooth*0.4 + v*0.6; if(smooth<1) smooth=0;
    if(smooth>trip.vmax && p.acc<60) trip.vmax = smooth; }
  if(!trip.start) trip.start = t;
  placeMarker(p.la,p.lo,p.acc);
  if(follow) map.setView([p.la,p.lo], Math.max(map.getZoom(),13), {animate:true});
  speedLog.push({t, v:smooth||0}); while(speedLog.length && t-speedLog[0].t>600000) speedLog.shift();
  saveTrip(); render(pos); geocode(p);
}
const speedLog = [];

function render(pos){
  const v = smooth;
  $('speed').firstChild.nodeValue = v==null ? '--' : nf0.format(v);
  $('vmax').textContent = trip.vmax ? nf0.format(trip.vmax) : '--';
  $('vavg').textContent = trip.movingMs>10000 ? nf0.format(trip.dist/(trip.movingMs/1000)*3.6) : '--';
  $('dist').textContent = nf1.format(trip.dist/1000);
  const secs = trip.start ? Math.floor((Date.now()-trip.start)/1000) : 0;
  const h=Math.floor(secs/3600), m=Math.floor(secs%3600/60), s=secs%60;
  $('time').textContent = h ? `${h}:${String(m).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
  if(pos){
    const c = pos.coords, acc = Math.round(c.accuracy);
    const st = $('status'); st.className = 'status ' + (acc<=30?'ok':acc<=100?'weak':'err');
    $('statusText').textContent = `GPS ±${acc} m`;
    let extra = '';
    if(c.heading!=null && !isNaN(c.heading) && (smooth||0)>3){const dirs=['N','NE','E','SE','S','SO','O','NO'];extra+=' · rumbo '+dirs[Math.round(c.heading/45)%8]}
    if(c.altitude!=null) extra+=` · ${Math.round(c.altitude)} m alt.`;
    $('coords').textContent = `${c.latitude.toFixed(5)}, ${c.longitude.toFixed(5)}${extra}`;
  }
  drawChart();
}
setInterval(()=>render(null),1000);

// --- Lugar más cercano (Nominatim, como mucho cada 45 s y tras moverse 1 km)
async function geocode(p){
  if(lastGeocode && (Date.now()-lastGeocode.t<45000 || hav(lastGeocode,p)<1000)) return;
  lastGeocode = {la:p.la, lo:p.lo, t:Date.now()};
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=es&lat=${p.la}&lon=${p.lo}`);
    const j = await r.json(); const a = j.address||{};
    const town = a.city||a.town||a.village||a.hamlet||a.suburb||a.municipality||'';
    const region = a.county||a.state_district||a.state||'';
    $('place').textContent = [town,region].filter(Boolean).join(', ') || j.display_name || 'En camino';
  }catch{ /* sin datos móviles: se queda el último lugar */ }
}

// --- Gráfico de velocidad (últimos 10 min)
function drawChart(){
  const cv=$('chart'), dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=h*dpr}
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  const cs=getComputedStyle(document.documentElement);
  const vmaxTrain = +document.querySelector('.train[aria-pressed="true"]')?.dataset.vmax || 200;
  const top = Math.max(vmaxTrain, ...speedLog.map(s=>s.v)) * 1.05, now=Date.now();
  ctx.strokeStyle=cs.getPropertyValue('--line'); ctx.lineWidth=1; ctx.fillStyle=cs.getPropertyValue('--muted'); ctx.font='10px '+cs.getPropertyValue('--mono');
  [0.5,1].forEach(f=>{const y=h-(vmaxTrain*f/top)*(h-4);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();ctx.fillText(nf0.format(vmaxTrain*f),2,y-2)});
  if(speedLog.length<2) return;
  const X=t=>w-(now-t)/600000*w, Y=v=>h-(v/top)*(h-4);
  const acc=cs.getPropertyValue('--accent').trim();
  ctx.beginPath(); speedLog.forEach((s,i)=>i?ctx.lineTo(X(s.t),Y(s.v)):ctx.moveTo(X(s.t),Y(s.v)));
  ctx.strokeStyle=acc; ctx.lineWidth=2; ctx.stroke();
  ctx.lineTo(X(speedLog[speedLog.length-1].t),h); ctx.lineTo(X(speedLog[0].t),h); ctx.closePath();
  ctx.globalAlpha=.15; ctx.fillStyle=acc; ctx.fill(); ctx.globalAlpha=1;
}

// --- Arranque, pantalla encendida y controles
function onErr(e){
  const st=$('status'); st.className='status err';
  $('statusText').textContent='Sin GPS';
  $('msg').textContent = e.code===1 ? 'Ubicación denegada: habilitala para este sitio en los ajustes del navegador y tocá «Empezar».'
    : e.code===3 ? 'El GPS tarda en responder (túnel o vagón cerrado). Sigue intentando…' : 'No se pudo leer la ubicación: '+e.message;
}
async function keepAwake(){try{wakeLock = await navigator.wakeLock?.request('screen')}catch{}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&watchId!=null)keepAwake()});
$('start').addEventListener('click',()=>{
  if(!('geolocation' in navigator)){$('msg').textContent='Este navegador no tiene GPS.';return}
  $('msg').textContent='';
  if(watchId!=null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(p=>{$('msg').textContent='';onPos(p)}, onErr, {enableHighAccuracy:true, maximumAge:0, timeout:20000});
  $('start').textContent='GPS activo'; if(!trip.pts.length) $('place').textContent='Buscando dónde estás…'; $('statusText').textContent='Buscando señal…';
  keepAwake();
});
$('follow').addEventListener('click',()=>{follow=!follow;$('follow').setAttribute('aria-pressed',String(follow));$('follow').textContent=follow?'Seguir':'Libre';
  if(follow&&trip.pts.length){const p=trip.pts[trip.pts.length-1];map.setView([p.la,p.lo],Math.max(map.getZoom(),13))}});
map.on('dragstart',()=>{if(follow){follow=false;$('follow').setAttribute('aria-pressed','false');$('follow').textContent='Libre'}});
let resetArmed=false;
$('reset').addEventListener('click',()=>{
  if(!resetArmed){resetArmed=true;$('reset').textContent='¿Seguro? Tocá otra vez';setTimeout(()=>{resetArmed=false;$('reset').textContent='Borrar viaje'},3000);return}
  resetArmed=false;$('reset').textContent='Borrar viaje';trip=emptyTrip();smooth=null;speedLog.length=0;trackLine.setLatLngs([]);saveTrip();render(null);
});
selectTrain(train);
</script>
</body>
</html>
